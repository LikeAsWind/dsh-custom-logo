<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">dsh-custom-logo</title>
  <desc id="heroDesc">上传两张图，自动替换 DeepSeek Harness 的浏览器 favicon 与侧边栏 Logo：左上为默认品牌界面，下方箭头表示上传两张图后自动替换为自定义品牌。</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#0A101C"/>
    </linearGradient>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,3 L5,9 L9,3 Z" fill="#4D6BFE"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#heroBg)"/>

  <!-- ══ Left: title block ══ -->
  <g>
    <text x="64" y="82" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" letter-spacing="4" fill="#8C97AE">DSH WEB PLUGIN / BRANDING</text>

    <text x="62" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="52" font-weight="700" fill="#E8EDF6">dsh-custom-logo</text>

    <text x="64" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="600" fill="#E8EDF6">上传两张图，换掉整套品牌标识</text>

    <text x="64" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8C97AE">favicon · 侧边栏宽标 · 窄栏图标，全部自动替换</text>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#C7D0E2" text-anchor="middle">
      <rect x="64" y="244" width="94" height="34" rx="17" fill="#101A2E" stroke="#2A3550"/>
      <text x="111" y="266">免切图</text>
      <rect x="168" y="244" width="94" height="34" rx="17" fill="#101A2E" stroke="#2A3550"/>
      <text x="215" y="266">免重启</text>
      <rect x="272" y="244" width="112" height="34" rx="17" fill="#101A2E" stroke="#2A3550"/>
      <text x="328" y="266">升级不丢</text>
    </g>

    <rect x="64" y="300" width="588" height="54" rx="12" fill="#0A0F1C" stroke="#263245"/>
    <text x="84" y="334" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="19" fill="#FFB454">$</text>
    <text x="106" y="334" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="19" fill="#E8EDF6">dsh plugin --profile web add dsh-custom-logo</text>
  </g>

  <!-- ══ Right: before / after browser mockups ══ -->
  <!-- BEFORE: default branding -->
  <g>
    <rect x="710" y="44" width="430" height="136" rx="14" fill="#0F172A" stroke="#2A3550"/>
    <rect x="726" y="52" width="238" height="22" rx="6" fill="#131E33"/>
    <circle cx="742" cy="63" r="7" fill="#4D6BFE"/>
    <path d="M736.5,64.5 Q742,57.5 747.5,64.5" stroke="#E8EDF6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <text x="756" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8C97AE">DeepSeek Harness</text>
    <rect x="1058" y="48" width="66" height="27" rx="13.5" fill="#0C1526" stroke="#2A3550"/>
    <text x="1091" y="67" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8C97AE" text-anchor="middle">默认</text>
    <line x1="726" y1="82" x2="1124" y2="82" stroke="#22304E" stroke-width="1.5"/>

    <rect x="726" y="92" width="200" height="76" rx="8" fill="#0C1424"/>
    <circle cx="742" cy="108" r="11" fill="#4D6BFE"/>
    <path d="M733,112 Q742,100 751,112" stroke="#E8EDF6" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="760" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" fill="#9AA6BF">DeepSeek Harness</text>
    <rect x="738" y="130" width="130" height="7" rx="3.5" fill="#1B2740"/>
    <rect x="738" y="146" width="96" height="7" rx="3.5" fill="#1B2740"/>

    <rect x="938" y="92" width="186" height="22" rx="6" fill="#121C31"/>
    <rect x="938" y="122" width="186" height="22" rx="6" fill="#121C31"/>
    <rect x="938" y="152" width="120" height="12" rx="6" fill="#121C31"/>
  </g>

  <!-- swap arrow -->
  <line x1="800" y1="190" x2="800" y2="236" stroke="#4D6BFE" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowDown)"/>
  <text x="824" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#E8EDF6">上传两张图</text>
  <text x="824" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8C97AE">自动裁切缩放，页面即刷新</text>

  <!-- AFTER: your branding -->
  <g>
    <rect x="710" y="252" width="430" height="136" rx="14" fill="#0F172A" stroke="#3A3B57"/>
    <rect x="726" y="260" width="176" height="22" rx="6" fill="#131E33"/>
    <rect x="734" y="261" width="14" height="14" rx="4" fill="#FFB454"/>
    <path d="M736.5,272 L741,265.5 L743.5,269 L745.5,266.5 L749,272 Z" fill="#0F172A"/>
    <text x="756" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#C7D0E2">ACME LABS · dsh</text>
    <rect x="1026" y="256" width="98" height="27" rx="13.5" fill="#1A1710" stroke="#6B5B3A"/>
    <text x="1075" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFB454" text-anchor="middle">你的品牌</text>
    <line x1="726" y1="290" x2="1124" y2="290" stroke="#22304E" stroke-width="1.5"/>

    <rect x="726" y="300" width="200" height="76" rx="8" fill="#0C1424"/>
    <rect x="736" y="308" width="22" height="22" rx="6" fill="#FFB454"/>
    <path d="M739,325 L745,316 L748.5,320.5 L751,317.5 L756,325 Z" fill="#0F172A"/>
    <text x="766" y="325" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#FFD9A0">ACME LABS</text>
    <rect x="738" y="338" width="130" height="7" rx="3.5" fill="#1B2740"/>
    <rect x="738" y="354" width="96" height="7" rx="3.5" fill="#1B2740"/>
    <rect x="736" y="364" width="212" height="0" fill="none"/>

    <rect x="938" y="300" width="186" height="22" rx="6" fill="#121C31"/>
    <rect x="938" y="330" width="186" height="22" rx="6" fill="#121C31"/>
    <rect x="938" y="360" width="120" height="12" rx="6" fill="#121C31"/>
  </g>
</svg>
