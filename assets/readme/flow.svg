<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">两张图，三处生效</title>
  <desc id="flowDesc">左侧为两个虚线上传插槽（网页图标方形图、侧边栏横向宽图），中间为 Canvas 自动处理节点，右侧为三个生效位置：浏览器标签页 favicon、展开侧边栏宽 Logo、折叠窄栏圆形图标。</desc>
  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3A4A73"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="26" fill="#0B1220"/>

  <!-- stage labels -->
  <g font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="18" fill="#8C97AE">
    <text x="64" y="58">① 上传两张图</text>
    <text x="474" y="58">② 自动处理</text>
    <text x="796" y="58">③ 三处生效</text>
  </g>

  <!-- slot card A: square -->
  <g>
    <rect x="64" y="76" width="310" height="124" rx="16" fill="#0D1730" stroke="#4D6BFE" stroke-width="1.8" stroke-dasharray="9 7"/>
    <rect x="88" y="98" width="38" height="38" rx="9" fill="#0F1B38" stroke="#4D6BFE" stroke-width="1.8"/>
    <path d="M107,127 L107,110 M99,118 L107,110 L115,118" stroke="#4D6BFE" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="146" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#E8EDF6">网页图标</text>
    <text x="146" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8C97AE">方形 · 任意尺寸 PNG / JPG / WebP</text>
    <text x="146" y="166" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#6E7A94">居中裁切 → 256×256</text>
  </g>

  <!-- slot card B: wide -->
  <g>
    <rect x="64" y="224" width="310" height="124" rx="16" fill="#0D1730" stroke="#4D6BFE" stroke-width="1.8" stroke-dasharray="9 7"/>
    <rect x="88" y="246" width="38" height="38" rx="9" fill="#0F1B38" stroke="#4D6BFE" stroke-width="1.8"/>
    <path d="M107,275 L107,258 M99,266 L107,258 L115,266" stroke="#4D6BFE" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="146" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#E8EDF6">侧边栏 Logo</text>
    <text x="146" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8C97AE">横向宽图 · 建议 3:1</text>
    <text x="146" y="314" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#6E7A94">等比缩放 → ≤1080×126</text>
  </g>

  <!-- process node -->
  <g>
    <rect x="474" y="96" width="250" height="204" rx="16" fill="#101A2E" stroke="#2A3550"/>
    <text x="599" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#E8EDF6" text-anchor="middle">Canvas 处理</text>
    <line x1="496" y1="146" x2="702" y2="146" stroke="#22304E" stroke-width="1.5"/>
    <circle cx="512" cy="172" r="4" fill="#4D6BFE"/>
    <text x="528" y="178" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#C7D0E2">缩放为标准 PNG</text>
    <circle cx="512" cy="206" r="4" fill="#4D6BFE"/>
    <text x="528" y="212" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#C7D0E2">原子写入 branding/</text>
    <circle cx="512" cy="240" r="4" fill="#4D6BFE"/>
    <text x="528" y="246" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#C7D0E2">?v=mtime 破缓存</text>
    <text x="599" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#6E7A94" text-anchor="middle">免重启 · 页面即刷新</text>
  </g>

  <!-- result cards -->
  <g>
    <rect x="796" y="76" width="340" height="96" rx="14" fill="#101A2E" stroke="#2A3550"/>
    <rect x="816" y="102" width="48" height="36" rx="7" fill="none" stroke="#8C97AE" stroke-width="1.8"/>
    <rect x="822" y="96" width="24" height="12" rx="4" fill="#101A2E" stroke="#8C97AE" stroke-width="1.8"/>
    <circle cx="830" cy="102" r="3" fill="#8C97AE"/>
    <text x="884" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#E8EDF6">浏览器标签页</text>
    <text x="884" y="142" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#8C97AE">favicon · 收藏夹图标</text>
  </g>
  <g>
    <rect x="796" y="194" width="340" height="96" rx="14" fill="#101A2E" stroke="#2A3550"/>
    <rect x="816" y="210" width="48" height="60" rx="8" fill="none" stroke="#8C97AE" stroke-width="1.8"/>
    <rect x="824" y="218" width="22" height="9" rx="3" fill="#4D6BFE"/>
    <rect x="824" y="236" width="30" height="5" rx="2.5" fill="#3A4A73"/>
    <rect x="824" y="248" width="24" height="5" rx="2.5" fill="#3A4A73"/>
    <rect x="824" y="260" width="18" height="5" rx="2.5" fill="#3A4A73"/>
    <text x="884" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#E8EDF6">展开侧边栏</text>
    <text x="884" y="260" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#8C97AE">宽 Logo · 高 42px</text>
  </g>
  <g>
    <rect x="796" y="312" width="340" height="96" rx="14" fill="#101A2E" stroke="#2A3550"/>
    <rect x="824" y="330" width="30" height="60" rx="12" fill="none" stroke="#8C97AE" stroke-width="1.8"/>
    <circle cx="839" cy="348" r="7" fill="#FFB454"/>
    <rect x="831" y="364" width="16" height="5" rx="2.5" fill="#3A4A73"/>
    <rect x="833" y="374" width="12" height="5" rx="2.5" fill="#3A4A73"/>
    <text x="884" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#E8EDF6">折叠窄栏</text>
    <text x="884" y="378" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="17" fill="#8C97AE">圆形图标 · 36px</text>
  </g>

  <!-- connectors -->
  <path d="M374,138 C420,138 430,172 466,178" fill="none" stroke="#3A4A73" stroke-width="1.8" marker-end="url(#flowArrow)"/>
  <path d="M374,286 C420,286 430,244 466,236" fill="none" stroke="#3A4A73" stroke-width="1.8" marker-end="url(#flowArrow)"/>
  <path d="M724,186 C750,186 756,124 770,124 L790,124" fill="none" stroke="#3A4A73" stroke-width="1.8" marker-end="url(#flowArrow)"/>
  <path d="M724,198 C750,198 756,242 770,242 L790,242" fill="none" stroke="#3A4A73" stroke-width="1.8" marker-end="url(#flowArrow)"/>
  <path d="M724,210 C750,210 756,360 770,360 L790,360" fill="none" stroke="#3A4A73" stroke-width="1.8" marker-end="url(#flowArrow)"/>
</svg>
